<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daftar Penyewa Baru - Connected</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Inter', system-ui, sans-serif; }
  body { background:#F9FAFB; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; color:#111827; }
  .card { width:100%; max-width:440px; background:white; border-radius:20px; padding:32px 28px; box-shadow:0 4px 24px rgba(0,0,0,0.06); border:1px solid #F3F4F6; }
  .icon { width:48px; height:48px; background:#EFF6FF; border-radius:12px; display:flex; align-items:center; justify-content:center; margin:0 auto 16px; }
  h1 { font-size:24px; font-weight:700; text-align:center; }
  .subtitle { text-align:center; font-size:14px; color:#6B7280; margin:8px 0 28px; }
  label { display:block; font-size:13.5px; font-weight:600; margin-bottom:8px; }
  .field { margin-bottom:20px; }
  input { width:100%; height:52px; padding:0 16px; border:1.5px solid #E5E7EB; border-radius:12px; font-size:16px; outline:none; transition:.2s; }
  input:focus { border-color:#2563EB; box-shadow:0 0 0 3px #DBEAFE; }
  input.error { border-color:#EF4444; box-shadow:0 0 0 3px #FEE2E2; }
  .err { font-size:12.5px; color:#EF4444; margin-top:6px; font-weight:500; display:none; }
  .err.show { display:block; }
  .pass-wrap { position:relative; } .pass-wrap input { padding-right:48px; }
  .eye { position:absolute; right:4px; top:4px; width:44px; height:44px; border:none; background:transparent; cursor:pointer; border-radius:10px; font-size:18px; }
  button.daftar { width:100%; height:52px; border:none; border-radius:14px; background:#2563EB; color:white; font-size:15.5px; font-weight:600; cursor:pointer; transition:.2s; box-shadow:0 4px 14px rgba(37,99,235,0.28); }
  button.daftar:disabled { background:#9CA3AF; cursor:not-allowed; box-shadow:none; }
  button.daftar:hover:not(:disabled) { background:#1D4ED8; }
  .login { text-align:center; font-size:13.5px; color:#6B7280; margin-top:18px; }
  .login a { font-weight:600; color:#111827; text-decoration:underline; }
  .toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%) translateY(80px); background:#111827; color:white; padding:14px 20px; border-radius:14px; display:flex; gap:12px; align-items:center; opacity:0; transition:.35s; pointer-events:none; z-index:50; max-width:90%; }
  .toast.show { transform:translateX(-50%) translateY(0); opacity:1; }
  .toast.error { background:#991B1B; }
  .check { width:28px; height:28px; background:rgba(255,255,255,0.15); border-radius:50%; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .connected { text-align:center; font-size:11px; color:#059669; background:#ECFDF5; border:1px solid #A7F3D0; padding:6px 10px; border-radius:20px; margin:0 auto 16px; width:fit-content; }
</style>
</head>
<body>
<div class="card">
  <div class="connected">● Terhubung ke Google Sheet</div>
  <div class="icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M3 9L12 2L21 9V20C21 20.55 20.55 21 20 21H4C3.45 21 3 20.55 3 20V9Z" stroke="#2563EB" stroke-width="1.8" stroke-linejoin="round"/><path d="M9 21V12H15V21" stroke="#2563EB" stroke-width="1.8" stroke-linejoin="round"/></svg></div>
  <h1>Daftar Penyewa Baru</h1>
  <p class="subtitle">Akun akan otomatis masuk ke Sheet</p>
  <form id="form" novalidate>
    <div class="field"><label>Nama Lengkap</label><input id="nama" type="text" placeholder="Contoh: Budi Santoso" autocomplete="name"><p class="err" id="err-nama">Wajib diisi</p></div>
    <div class="field"><label>Nomor Telepon</label><input id="telp" type="tel" placeholder="Contoh: 0812xxxxxxx" autocomplete="tel"><p class="err" id="err-telp">Wajib diisi</p></div>
    <div class="field"><label>Domisili</label><input id="domisili" type="text" placeholder="Contoh: Jakarta Selatan" autocomplete="address-level2"><p class="err" id="err-domisili">Wajib diisi</p></div>
    <div class="field"><label>Kata Sandi</label><div class="pass-wrap"><input id="pass" type="password" placeholder="Minimal 6 karakter"><button type="button" class="eye" onclick="toggle('pass', this)">👁</button></div><p class="err" id="err-pass">Minimal 6 karakter</p></div>
    <div class="field"><label>Konfirmasi Kata Sandi</label><div class="pass-wrap"><input id="konfirmasi" type="password" placeholder="Ulangi kata sandi"><button type="button" class="eye" onclick="toggle('konfirmasi', this)">👁</button></div><p class="err" id="err-konfirmasi">Tidak cocok</p></div>
    <button type="submit" class="daftar" id="btn">Daftar</button>
    <p class="login">Sudah punya akun? <a href="#">Masuk di sini.</a></p>
  </form>
</div>
<div class="toast" id="toast"><div class="check" id="toast-icon">✓</div><div id="toast-msg"><div style="font-weight:600; font-size:13.5px;">Pendaftaran berhasil!</div><div style="font-size:12px; opacity:.7;">Data masuk ke Google Sheet.</div></div></div>
<script>
const SHEET_URL = 'https://script.google.com/macros/s/AKfycbzBG9TXYz1g19xpd-XpLXrzfnwSGnM9ojHKzpV5HGfuulP70hNYFAbMmmk4IoJuQoIH/exec';
function toggle(id, btn){
  const i = document.getElementById(id);
  i.type = i.type === 'password' ? 'text' : 'password';
  btn.textContent = i.type === 'text' ? '🙈' : '👁';
}
document.getElementById('form').addEventListener('submit', async function(e){
  e.preventDefault();
  let ok = true;
  const nama = document.getElementById('nama'), telp = document.getElementById('telp'), dom = document.getElementById('domisili'), pass = document.getElementById('pass'), kon = document.getElementById('konfirmasi'), btn = document.getElementById('btn');
  document.querySelectorAll('.err').forEach(el=>el.classList.remove('show'));
  document.querySelectorAll('input').forEach(el=>el.classList.remove('error'));
  if(!nama.value.trim()){ show('err-nama', nama); ok=false; }
  if(!telp.value.trim()){ show('err-telp', telp); ok=false; }
  if(!dom.value.trim()){ show('err-domisili', dom); ok=false; }
  if(pass.value.length < 6){ show('err-pass', pass); ok=false; }
  if(kon.value !== pass.value || !kon.value){ show('err-konfirmasi', kon); ok=false; }
  if(!ok) return;
  btn.disabled = true; 
  const originalText = btn.textContent;
  btn.textContent = 'Menyimpan...';
  try {
    await fetch(SHEET_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        nama: nama.value.trim(),
        telp: telp.value.trim(),
        domisili: dom.value.trim(),
        password: pass.value
      })
    });
    
    showToast('Pendaftaran berhasil! Data masuk ke Google Sheet kamu', false);
    this.reset();
    
  } catch(err){
    showToast('Gagal: ' + err.message, true);
  } finally {
    btn.disabled = false; 
    btn.textContent = originalText;
  }
  function show(errId, input){ document.getElementById(errId).classList.add('show'); input.classList.add('error'); }
});
function showToast(msg, isError){
  const t = document.getElementById('toast');
  const icon = document.getElementById('toast-icon');
  document.getElementById('toast-msg').innerHTML = `<div style="font-weight:600; font-size:13.5px;">${isError ? 'Gagal' : 'Pendaftaran berhasil!'}</div><div style="font-size:12px; opacity:.8; margin-top:2px;">${msg}</div>`;
  icon.textContent = isError ? '✕' : '✓';
  t.classList.toggle('error', isError);
  t.classList.add('show');
  setTimeout(()=> t.classList.remove('show'), 4000);
}
</script>
</body>
</html>
